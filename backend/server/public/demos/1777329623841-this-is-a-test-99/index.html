<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Data Center Sim — Phase 2 (Interactive)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="./index.css" rel="stylesheet" />
</head>
<body>
  <main class="container">
    <!-- Header + inline actions -->
    <header class="topbar">
      <div class="titlebar">
        <h1>Data Center Simulation</h1>
        <div class="title-actions">
          <button id="howto-btn" class="btn btn--sm">How to Use</button>
          <button id="sources-btn" class="btn btn--sm">Sources</button>
        </div>
      </div>
      <p class="sub">Tweak inputs, see water / CO₂ / cost change in real time.</p>
    </header>

    <section class="layout">
      <!-- Controls -->
      <aside class="controls">
        <!-- BASELINE (Odense-style) -->
        <div class="card">
          <h2>Baseline</h2>

          <label>
            Daily IT electricity (kWh)
            <input type="number" id="b-it" value="700000" min="0" step="1000">
          </label>

          <label>
            Grid CO₂ (kg/kWh)
            <input type="number" id="b-gridco2" value="0.096" min="0" step="0.001">
          </label>

          <label>
            Onsite solar (%)
            <input type="range" id="b-solar" min="0" max="100" value="0">
            <span class="val" data-for="b-solar"></span>
          </label>

          <label>
            Heat reuse (%)
            <input type="range" id="b-reuse" min="0" max="100" value="43">
            <span class="val" data-for="b-reuse"></span>
          </label>

          <label>
            WUE (L/kWh)
            <input type="number" id="b-wue" value="0.10" min="0" step="0.01">
          </label>

          <label>
            Cooling mode
            <select id="b-mode">
              <option value="evaporative" selected>Evaporative (drinking)</option>
              <option value="closedLoop">Closed-loop (near dry)</option>
            </select>
          </label>

          <button id="reset-base">Reset defaults</button>
        </div>

        <!-- GO-GREEN -->
        <div class="card">
          <h2>Go-Green Scenario</h2>

          <label>
            Daily IT electricity (kWh)
            <input type="number" id="g-it" value="650000" min="0" step="1000">
          </label>

          <label>
            Grid CO₂ (kg/kWh)
            <input type="number" id="g-gridco2" value="0.05" min="0" step="0.001">
          </label>

          <label>
            Onsite solar (%)
            <input type="range" id="g-solar" min="0" max="100" value="30">
            <span class="val" data-for="g-solar"></span>
          </label>

          <label>
            Heat reuse (%)
            <input type="range" id="g-reuse" min="0" max="100" value="70">
            <span class="val" data-for="g-reuse"></span>
          </label>

          <label>
            WUE (L/kWh)
            <input type="number" id="g-wue" value="0.02" min="0" step="0.01">
          </label>

          <label>
            Cooling mode
            <select id="g-mode">
              <option value="evaporative">Evaporative (drinking)</option>
              <option value="closedLoop" selected>Closed-loop (near dry)</option>
            </select>
          </label>

          <button id="reset-green">Reset defaults</button>
        </div>

        <!-- PRICES -->
        <div class="card">
          <h2>Prices</h2>
          <div class="twocol">
            <label>
              Grid price ($/kWh)
              <input type="number" id="p-grid" value="0.081" min="0" step="0.001">
            </label>
            <label>
              Solar price ($/kWh)
              <input type="number" id="p-solar" value="0.058" min="0" step="0.001">
            </label>
            <label>
              Water ($/kgal)
              <input type="number" id="p-water" value="5.0" min="0" step="0.1">
            </label>
            <label>
              Carbon ($/tCO₂)
              <input type="number" id="p-carbon" value="51" min="0" step="1">
            </label>
          </div>
          <button id="reset">Reset defaults</button>
        </div>
      </aside>

      <!-- Results -->
      <section class="results">
        <div class="panel">
          <h2>Baseline Results</h2>
          <div class="stats" id="out-baseline"></div>
        </div>

        <div class="panel">
          <h2>Go-Green Results</h2>
          <div class="stats" id="out-green"></div>
        </div>

        <div class="panel">
          <h2>Delta (Green − Baseline)</h2>
          <div class="stats" id="out-delta"></div>
        </div>
      </section>
    </section>
  </main>

  <!-- Reusable modal for How-To and Sources -->
  <div id="generic-modal" class="modal" aria-hidden="true" role="dialog" aria-labelledby="generic-title">
    <div class="modal__backdrop" data-close></div>
    <div class="modal__content" role="document">
      <div class="modal__header">
        <h3 id="generic-title">Modal</h3>
        <button class="modal__close" aria-label="Close" title="Close" data-close>&times;</button>
      </div>
      <iframe id="generic-iframe" title="Content"></iframe>
    </div>
  </div>

  <script defer src="./index.js"></script>
</body>
</html>
